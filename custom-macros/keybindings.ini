[general]
# Tilde cycles through the three active rows below.
toggle = grave
key_delay_ms = 50
# Keep generated keys down long enough for games that poll input once per frame.
key_hold_ms = 40
show_overlay = yes
modes = economy, military, helpers
# Wayland only: a device path or unique part of the one-hand keyboard's name.
wayland_device = HCT USB Entry Keyboard

# Set a layer to no to disable it. Tilde skips disabled mode layers, while
# disabling groups turns off the permanent Shift+number shortcuts.
[layers]
economy = yes
military = yes
helpers = yes
groups = yes

# Format: trigger = keys sent to AoE | label shown in the overlay
# These sequences assume the matching in-game hotkeys from README.md.
[economy]
1 = q q | House
2 = q a | Farm
3 = q r | Lumber Camp
4 = q w | Mill
5 = q e | Mining Camp
6 = q t | Dock

[military]
1 = w q | Barracks
2 = w w | Archery Range
3 = w e | Stable
4 = q z | Palisade Wall
5 = q c | Stone Wall
6 = w f | Watch Tower

[helpers]
1 = shift+space q w | TCs: Villager + Back To Work
2 = mouse_5 q a mouse_left | Idle Villager: Place Farm
3 = shift+tab g | Idle Villagers: Seek Shelter
4 = t mouse_left | Selected Villagers: Garrison At Cursor
5 = shift+grave mouse_right | Move Idle Military To Cursor

# Permanent shortcuts: select units or villagers, then press Shift+1 through
# Shift+5 to replace that control group from any active row. Recall with F1-F5.
[groups]
1 = ctrl+1 | Set Group 1
2 = ctrl+2 | Set Group 2
3 = ctrl+3 | Set Group 3
4 = ctrl+4 | Set Group 4
5 = ctrl+5 | Set Group 5
6 = ctrl+6 | Set Group 6
