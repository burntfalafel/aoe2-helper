[general]
# Tilde cycles through the four rows below.
toggle = grave
key_delay_ms = 50
# Keep generated keys down long enough for games that poll input once per frame.
key_hold_ms = 40
show_overlay = yes
modes = economy, military, helpers, groups
# Wayland only: a device path or unique part of the one-hand keyboard's name.
wayland_device =

# Format: trigger = keys sent to AoE | label shown in the overlay
# These sequences assume the matching in-game hotkeys from README.md.
[economy]
1 = q q | House
2 = q e | Farm
3 = q r | Lumber Camp
4 = q t | Mill
5 = q f | Mining Camp
6 = q g | Dock

[military]
1 = e q | Barracks
2 = e e | Archery Range
3 = e r | Stable
4 = e t | Siege Workshop
5 = e f | Castle
6 = e g | Watch Tower

[helpers]
1 = shift+space q w | TCs: Villager + Back To Work
2 = tab q e mouse_left | Idle Villager: Place Farm
3 = shift+tab g | Idle Villagers: Seek Shelter
4 = t mouse_left | Selected Villagers: Garrison At Cursor
5 = shift+grave mouse_right | Move Idle Military To Cursor

# Select some units or villagers, then use this row to replace a control group.
# Recall the groups with F1-F5, configured directly inside AoE2 DE.
[groups]
1 = ctrl+1 | Set Group 1
2 = ctrl+2 | Set Group 2
3 = ctrl+3 | Set Group 3
4 = ctrl+4 | Set Group 4
5 = ctrl+5 | Set Group 5
